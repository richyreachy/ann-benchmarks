# Default target: official ANN Recall@10 >= 90% (distance tolerance 0.001).
# The native recall tool below measures strict ID recall: 89.061% on this snapshot.
# Validated on the M64/800 full graph at code 686f898c; recalibrate new builds.
# See ../GLOVE.zh-CN.md. Only replace paths to use the matching build snapshot.
# ./build/bin/recall tools/core/bench/config/glove_fp32_recall_bench.yaml
# ./build/bin/bench tools/core/bench/config/glove_fp32_recall_bench.yaml
IndexCommon:
  IndexConfig: >-
    {"index_type":"kHNSW","data_type":"DT_FP32",
     "metric_type":"kCosine","dimension":100,
     "m":64,"ef_construction":800,
     "use_id_map":true,"use_quantized_graph":true,
     "quantizer_param":{"type":"kNone"}}
  IndexPath: /data/glove/glove_fp32_m64_ef800_full.index
  TopK: 10
  QueryFile: /data/glove/queries.txt
  QueryFirstSep: ";"
  QuerySecondSep: " "
  QueryType: float
  RetrievalMode: dense
  FilterMode: none
  GroundTruthFile: /data/glove/neighbors.txt
  GroundTruthFirstSep: ";"
  GroundTruthSecondSep: " "
  CompareById: true
  RecallThreadCount: 1
  RecallBatchCount: 0
  RecallGTCount: 10
  RecallLogDir: /data/glove/fp32_m64_ef800_recall_logs
  BenchThreadCount: 1
  BenchThreadCounts: [1]
  BenchRounds: 5
  BenchSecs: 6
  BenchBatchCount: 1
  BenchIterCount: 1000000000
  LogLevel: info

# This single configuration is used unless QueryParams is explicitly added.
# The saved codec/router already contain RotationViews; no QG_* env is needed.
QueryConfig:
  QueryParam: >-
    {"index_type":"kHNSW","ef_search":1024,
     "quantized_graph_margin":0.063,
     "quantized_graph_bucket_width":0.006,
     "quantized_graph_max_expansions":384,
     "quantized_graph_route_beam":1,
     "quantized_graph_uncertainty_bonus":0}
