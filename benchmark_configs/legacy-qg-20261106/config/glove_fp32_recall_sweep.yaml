# Official ANN Recall@10 presets: 90%, 95%, 99%; case numbers changed.
# The native recall tool below still measures strict ID recall for validation.
# Validated on the M64/800 full graph at code 686f898c; recalibrate new builds.
# See ../GLOVE.zh-CN.md. Only replace paths to use the matching build snapshot.
# ./build/bin/recall tools/core/bench/config/glove_fp32_recall_sweep.yaml
# ./build/bin/bench tools/core/bench/config/glove_fp32_recall_sweep.yaml
IndexCommon:
  IndexConfig: >-
    {"index_type":"kHNSW","data_type":"DT_FP32",
     "metric_type":"kCosine","dimension":100,
     "m":64,"ef_construction":800,
     "use_id_map":true,"use_quantized_graph":true,
     "quantizer_param":{"type":"kNone"}}
  IndexPath: /data/glove/glove_fp32_m64_ef800_full.index
  TopK: 10
  QueryFile: /data/glove/queries.txt
  QueryFirstSep: ";"
  QuerySecondSep: " "
  QueryType: float
  RetrievalMode: dense
  FilterMode: none
  GroundTruthFile: /data/glove/neighbors.txt
  GroundTruthFirstSep: ";"
  GroundTruthSecondSep: " "
  CompareById: true
  RecallThreadCount: 1
  RecallBatchCount: 0
  RecallGTCount: 10
  RecallLogDir: /data/glove/fp32_m64_ef800_sweep_logs
  BenchThreadCount: 1
  BenchThreadCounts: [1]
  BenchRounds: 5
  BenchSecs: 6
  BenchBatchCount: 1
  BenchIterCount: 1000000000
  LogLevel: info

# QueryParams overrides QueryParam. Case numbers below are zero-based.
# recall reports STRICT ID recall for every case, including ANN-target presets.
QueryConfig:
  QueryParam: >-
    {"index_type":"kHNSW","ef_search":1024,"quantized_graph_margin":0.063,"quantized_graph_max_expansions":384,"quantized_graph_bucket_width":0.006,"quantized_graph_route_beam":1,"quantized_graph_uncertainty_bonus":0}
  QueryParams:
    # case 0: official ANN 90%; measured values in ../GLOVE.zh-CN.md
    - >-
      {"index_type":"kHNSW","ef_search":1024,"quantized_graph_margin":0.063,"quantized_graph_max_expansions":384,"quantized_graph_bucket_width":0.006,"quantized_graph_route_beam":1,"quantized_graph_uncertainty_bonus":0}
    # case 1: official ANN 95%; measured values in ../GLOVE.zh-CN.md
    - >-
      {"index_type":"kHNSW","ef_search":2048,"quantized_graph_margin":0.092,"quantized_graph_max_expansions":768,"quantized_graph_bucket_width":0.002,"quantized_graph_route_beam":1,"quantized_graph_uncertainty_bonus":0}
    # case 2: official ANN 99%; measured values in ../GLOVE.zh-CN.md
    - >-
      {"index_type":"kHNSW","ef_search":2048,"quantized_graph_margin":0.1257,"quantized_graph_max_expansions":1536,"quantized_graph_bucket_width":0.002,"quantized_graph_route_beam":1,"quantized_graph_uncertainty_bonus":0}
