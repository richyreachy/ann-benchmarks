# GloVe-100-angular: 1,183,514 vectors, cosine, FP32 storage, M64/efConstruction800 (2026-11-06).
# See ../GLOVE.zh-CN.md for data preparation, validated search presets and costs.
# Replace /data/glove paths. BuildFile is zvec.vecs, not HDF5/fvecs/text.
# Fresh build: ./build/bin/local_builder tools/core/bench/config/glove_fp32_build.yaml
# Build a new graph: re-encoding an M32 snapshot does not upgrade it to M64.
# InputIndex requires a raw HnswStreamer snapshot without persisted QG blocks,
# and is only comparable when its graph construction matches M64/800.
BuilderCommon:
  BuilderClass: HnswStreamer
  BuildFile: /data/glove/glove100_base.zvec.vecs
  MetricName: Cosine
  ConverterName: CosineFp32Converter
  IndexPath: /data/glove/glove_fp32_m64_ef800_work.index
  DumpPath: /data/glove/glove_fp32_m64_ef800_full.index
  DumpFormat: streamer
  MaxDocs: 1183514
  ThreadCount: 8
  LogLevel: info

BuilderParams:
  proxima.hnsw.streamer.max_neighbor_count: !!int 64
  proxima.hnsw.streamer.efconstruction: !!int 800
  proxima.hnsw.streamer.get_vector_enable: !!bool true

QuantizedGraphRouter:
  Anchors: 65536
  ProjectedDimension: 64
  Seed: 202610261259

QuantizedGraph:
  Persist: true
  RotationViews: 2
  MaxNeighbors: 64
  ThreadCount: 8
  Codec:
    Type: native
